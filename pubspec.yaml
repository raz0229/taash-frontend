name: taash
description: TaashOnline — Bhabhi, Daketi, Bluff, Tissar-Chousar.
publish_to: none
version: 1.2.0+20
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  intl: any
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.1.0
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  firebase_messaging: ^16.0.0
  google_sign_in: ^7.2.0
  in_app_update: ^5.0.0
  in_app_purchase: ^3.2.3
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalogs/
    - assets/brand/
    - assets/cards/
    - assets/cards/default/
    - assets/cards/abyss/
    - assets/cards/basant/
    - assets/cards/amber/
    - assets/cards/frostforge/
    - assets/cards/green_room/
    - assets/cards/vintage/
    - assets/cards/midnight/
    - assets/cards/monsoon/
    - assets/cards/neon_city/
    - assets/cards/phool_patti/
    - assets/cards/pixel_quest/
    - assets/cards/starfall/
    - assets/pfps/
    - assets/purchases/
    - assets/reactions/
    - assets/audio/
    - assets/audio/reactions/
    - assets/audio/thullu-soundboard/
    - assets/fonts/OFL.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
