name: taash
description: TaashOnline — a social South Asian card night.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  intl: any
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.1.0
  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  google_sign_in: ^6.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalogs/
    - assets/brand/
    - assets/cards/
    - assets/pfps/
    - assets/reactions/
    - assets/audio/
    - assets/fonts/OFL.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
